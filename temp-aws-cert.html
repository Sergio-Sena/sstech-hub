<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Certification Platform - SStech</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #232F3E 0%, #FF9900 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #232F3E; font-size: 2.5em; margin-bottom: 20px; }
        .icon { font-size: 80px; margin-bottom: 20px; }
        p { color: #555; font-size: 1.2em; line-height: 1.6; margin-bottom: 30px; }
        .btn {
            display: inline-block;
            background: #FF9900;
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            transition: transform 0.3s;
            margin: 10px;
        }
        .btn:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎓</div>
        <h1>AWS Certification Platform</h1>
        <p>Plataforma de estudos para certificações AWS</p>
        <a href="https://sergio-sena.github.io/AWS-Certification-Platform" class="btn">Acessar no GitHub Pages</a>
        <a href="https://hub.sstechnologies-cloud.com" class="btn">← Voltar ao Hub</a>
    </div>
</body>
</html>
